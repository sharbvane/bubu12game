name: Android APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Read project versions
        id: version
        shell: bash
        run: |
          set -euo pipefail
          APP_VERSION="$(sed -n 's/^version\/name="\([^"]*\)".*/\1/p' export_presets.cfg | head -n1)"
          VERSION_CODE="$(sed -n 's/^version\/code=\([0-9][0-9]*\)$/\1/p' export_presets.cfg | head -n1)"
          GODOT_VERSION="$(sed -nE 's/^; Open this project with Godot ([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' project.godot | head -n1)"
          [[ "$APP_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$VERSION_CODE" =~ ^[0-9]+$ ]]
          [[ "$GODOT_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "v$APP_VERSION" ]]; then
            echo "Tag $GITHUB_REF_NAME must match export version v$APP_VERSION." >&2
            exit 1
          fi
          echo "app_version=$APP_VERSION" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "godot_version=$GODOT_VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android export requirements
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --sdk_root="$ANDROID_HOME" --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.1"

      - name: Install matching Godot engine and export templates
        shell: bash
        env:
          GODOT_VERSION: ${{ steps.version.outputs.godot_version }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/godot" "$RUNNER_TEMP/templates"
          BASE="https://github.com/godotengine/godot/releases/download/$GODOT_VERSION-stable"
          curl -fsSL "$BASE/Godot_v$GODOT_VERSION-stable_linux.x86_64.zip" -o "$RUNNER_TEMP/godot.zip"
          curl -fsSL "$BASE/Godot_v$GODOT_VERSION-stable_export_templates.tpz" -o "$RUNNER_TEMP/templates.tpz"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          unzip -q "$RUNNER_TEMP/templates.tpz" -d "$RUNNER_TEMP/templates"
          GODOT="$RUNNER_TEMP/godot/Godot_v$GODOT_VERSION-stable_linux.x86_64"
          chmod +x "$GODOT"
          "$GODOT" --headless --version
          mkdir -p "$HOME/.local/share/godot/export_templates/$GODOT_VERSION.stable"
          TEMPLATE_SOURCE="$RUNNER_TEMP/templates"
          if [[ -d "$TEMPLATE_SOURCE/templates" ]]; then
            TEMPLATE_SOURCE="$TEMPLATE_SOURCE/templates"
          fi
          cp -a "$TEMPLATE_SOURCE/." "$HOME/.local/share/godot/export_templates/$GODOT_VERSION.stable/"
          test -f "$HOME/.local/share/godot/export_templates/$GODOT_VERSION.stable/android_release.apk"

      - name: Export and verify signed APK
        id: export
        shell: bash
        env:
          APP_VERSION: ${{ steps.version.outputs.app_version }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          GODOT_VERSION: ${{ steps.version.outputs.godot_version }}
        run: |
          set -euo pipefail
          if [[ -z "$ANDROID_KEYSTORE_BASE64" || -z "$ANDROID_KEYSTORE_PASSWORD" ]]; then
            echo "Set repository Actions secrets ANDROID_KEYSTORE_BASE64 and ANDROID_KEYSTORE_PASSWORD." >&2
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/signing"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/signing/release.keystore"
          test -s "$RUNNER_TEMP/signing/release.keystore"
          export GODOT_ANDROID_KEYSTORE_RELEASE_PATH="$RUNNER_TEMP/signing/release.keystore"
          export GODOT_ANDROID_KEYSTORE_RELEASE_USER="bubugarden"
          export GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD="$ANDROID_KEYSTORE_PASSWORD"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.7.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/android_sdk_path = "$ANDROID_HOME"
          EOF
          GODOT="$RUNNER_TEMP/godot/Godot_v$GODOT_VERSION-stable_linux.x86_64"
          APK="$RUNNER_TEMP/YierBubu-Garden-v$APP_VERSION.apk"
          LOG="$RUNNER_TEMP/export.log"
          {
            "$GODOT" --headless --editor --path "$GITHUB_WORKSPACE" --import
            "$GODOT" --headless --path "$GITHUB_WORKSPACE" --export-release Android "$APK"
            test -s "$APK"
            test "$(stat -c %s "$APK")" -gt 20000000
            "$ANDROID_HOME/build-tools/35.0.1/apksigner" verify --verbose "$APK"
            "$ANDROID_HOME/build-tools/35.0.1/aapt" dump badging "$APK" \
              | grep -F "package: name='com.bubugarden.survivors' versionCode='$VERSION_CODE' versionName='$APP_VERSION'"
            sha256sum "$APK" | awk -v name="$(basename "$APK")" '{print $1 "  " name}' | tee "$APK.sha256"
          } 2>&1 | tee "$LOG"
          echo "apk=$APK" >> "$GITHUB_OUTPUT"

      - name: Upload test APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: YierBubu-Garden-v${{ steps.version.outputs.app_version }}-Android
          path: |
            ${{ steps.export.outputs.apk }}
            ${{ steps.export.outputs.apk }}.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Upload export log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-export-log
          path: ${{ runner.temp }}/export.log
          if-no-files-found: ignore
          retention-days: 30

      - name: Publish tagged GitHub Release
        if: github.ref_type == 'tag'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APP_VERSION: ${{ steps.version.outputs.app_version }}
          APK: ${{ steps.export.outputs.apk }}
        run: |
          set -euo pipefail
          NOTES="docs/v$APP_VERSION.md"
          if [[ ! -f "$NOTES" ]]; then
            echo "Missing Chinese release notes: $NOTES" >&2
            exit 1
          fi
          {
            printf '# 一二布布甜莓守护战 v%s\n\n' "$APP_VERSION"
            cat "$NOTES"
            printf '\n\n## 安装说明 / Installation\n\n'
            printf '下载下方 Android APK 并在手机上安装。此版本沿用原包名和签名，可覆盖安装。\n\n'
            printf 'Download the Android APK below and install it on your device. It uses the existing package name and signing key and can update the previous version.\n'
          } > "$RUNNER_TEMP/release-notes.md"
          gh release create "$GITHUB_REF_NAME" "$APK" "$APK.sha256" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "一二布布甜莓守护战 v$APP_VERSION" \
            --notes-file "$RUNNER_TEMP/release-notes.md"
